name: Security and release gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The only measurement behind this number: on 2026-09-03, on a 10-core machine, the top-level test
    # durations summed to 22.1 minutes. Note what that is and is not. It is a LOWER bound for a serial
    # run on THAT machine -- it excludes per-file process startup, and a slower runner core makes it
    # larger, not smaller. It is not a worst case, and two earlier versions of this comment each
    # claimed it was something it is not: first that a two-core runner made twenty minutes
    # "impossible" (a core count nobody here measured), then that 22.1 minutes was the worst case
    # "regardless of parallelism" (a floor read as a ceiling). Neither the runner's core count nor its
    # per-core speed has been measured from here, so no honest conclusion of the form "a serial run
    # fits" is available. 45 is chosen as roughly twice the only number we have, as a runaway
    # backstop. A red tick here means the job exceeded that budget -- which may be a hang, or may be a
    # legitimately slower runner; it is not by itself evidence of either.
    timeout-minutes: 45
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
      npm_config_audit: "true"
      npm_config_fund: "false"
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js without automatic dependency cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run security, coverage, SBOM, audit, reproduction and package gates
        run: npm run check:release
