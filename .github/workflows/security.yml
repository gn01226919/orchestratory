name: Security and release gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Measured 2026-09-03 on a 10-core machine: the top-level test durations sum to 22.1 minutes, which
    # is the floor for a serial run and excludes per-file process startup. A free runner has two cores,
    # and `--test-concurrency` was unset, so the gate defaulted to near-serial there and could not have
    # finished inside twenty minutes -- a red tick that says "timed out", which reads to a first-time
    # contributor as "your change broke it". The suite now pins concurrency rather than inheriting the
    # core count, and this ceiling is deliberately generous: it is a runaway backstop, not a target, and
    # the number was not verified on a real runner from here.
    timeout-minutes: 45
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
      npm_config_audit: "true"
      npm_config_fund: "false"
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js without automatic dependency cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run security, coverage, SBOM, audit, reproduction and package gates
        run: npm run check:release
